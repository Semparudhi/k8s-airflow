apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: minio-probe
  namespace: spark
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: spark-s3:3.5.5
  imagePullPolicy: IfNotPresent
  sparkVersion: "3.5.5"
  mainApplicationFile: local:///opt/jobs/minio_probe.py
  restartPolicy:
    type: Never
  hadoopConf:
    fs.s3a.endpoint: "http://minio.minio.svc.cluster.local:9000"
    fs.s3a.path.style.access: "true"
    fs.s3a.connection.ssl.enabled: "false"
    fs.s3a.aws.credentials.provider: "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
  volumes:
    - name: job-code
      configMap:
        name: minio-probe-job
  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark
    envFrom:
      - secretRef:
          name: minio-creds
    volumeMounts:
      - name: job-code
        mountPath: /opt/jobs
  executor:
    instances: 1
    cores: 1
    memory: 1g
    envFrom:
      - secretRef:
          name: minio-creds