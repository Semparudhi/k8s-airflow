executor: "KubernetesExecutor"

airflowVersion: "3.3.1"
defaultAirflowTag: "3.3.1"

images:
  airflow:
    repository: apache/airflow
    tag: "3.3.1"
    pullPolicy: IfNotPresent

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: true
    repo: https://github.com/Semparudhi/k8s-airflow.git
    branch: master
    subPath: "dags"
    wait: 30

statsd:
  enabled: false

redis:
  enabled: false

postgresql:
  enabled: true

scheduler:
  resources:
    requests: {cpu: 200m, memory: 768Mi}
    limits: {memory: 1536Mi}

apiServer:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}

dagProcessor:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}

triggerer:
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 768Mi}

workers:
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 768Mi}

config:
  core:
    parallelism: "6"
    load_examples: "False"
  kubernetes_executor:
    delete_worker_pods: "True"
  logging:
    remote_logging: "True"
    remote_base_log_folder: "s3://airflow-logs/logs"
    remote_log_conn_id: "minio_s3"
  

extraEnvFrom: |
  - secretRef:
      name: airflow-connections

